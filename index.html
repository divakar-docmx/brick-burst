<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Burst</title>
<meta name="theme-color" content="#161616">
<meta name="description" content="Break through the wall, burst the bricks, catch +3 to split your ball.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Brick Burst">
<style>
  html, body { margin: 0; height: 100%; background: #0e0e0e; overflow: hidden; touch-action: none;
               overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #levels { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(8, 8, 8, 0.86); z-index: 10; font-family: system-ui, sans-serif; color: #e9e9e9; }
  #levels.open { display: flex; }
  #levels .panel { width: min(92vw, 520px); max-height: 92vh; overflow-y: auto; padding: 16px;
                   box-sizing: border-box; background: #1c1c1c; border: 1px solid #333; border-radius: 12px; }
  #levels header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #levels h2 { margin: 0; font-size: 18px; }
  #levels .close { background: #2c2c2c; color: #e9e9e9; border: 0; border-radius: 8px; width: 36px; height: 36px;
                   font-size: 20px; cursor: pointer; }
  #levels .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  #levels .tile { background: #242424; border: 2px solid transparent; border-radius: 10px; padding: 8px;
                  color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #levels .tile:hover, #levels .tile:focus-visible { border-color: #8a8a8a; outline: none; }
  #levels .tile.current { border-color: #e8786a; }
  #levels .tile canvas { width: 100%; aspect-ratio: 48 / 52; display: block; border-radius: 4px; image-rendering: pixelated; }
  #levels .name { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; }
  #levels .done { color: #e6c23a; }
  #levels .note { margin: 12px 0 0; font-size: 12px; color: #8d8d8d; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="levels" role="dialog" aria-modal="true" aria-labelledby="levels-title">
  <div class="panel">
    <header><h2 id="levels-title">Choose a level</h2><button class="close" aria-label="Close">×</button></header>
    <div class="grid"></div>
    <p class="note">Starting a level begins a new run: score 0, 3 lives.</p>
  </div>
</div>
<script>
(() => {
  // ---------- Layout (logical pixels) ----------
  const CELL = 10;
  const COLS = 48;               // grid columns -> width 480
  const ENC_ROWS = 52;           // enclosure rows: 0 = top wall, 51 = bottom wall
  const W = COLS * CELL;         // 480
  const H = 820;
  const SPECIAL_CHANCE = 0.036;

  const EMPTY = 0, WALL = 1, BRICK = 2, SPECIAL = 3;

  const BALL_R = 4;
  const SPEED_LEVELS = [180, 240, 300, 360, 420, 480, 560, 640, 730, 820];
  let speedLevel = 4;            // index into SPEED_LEVELS (shown as 1-10)
  let ballSpeed = SPEED_LEVELS[speedLevel];
  const MAX_BALLS = 400;

  const PADDLE_W = 110, PADDLE_H = 12, PADDLE_Y = H - 130, PADDLE_SPEED = 560;

  const COLORS = {
    bg: '#161616',
    brick: '#7c2f22', brickEdge: '#4a1a12',
    special: '#e6c23a', specialEdge: '#9b7f18',
    wall: '#8a8a8a', wallEdge: '#4d4d4d',
    paddle: '#e8786a', ball: '#f4f4f4',
    pickup: '#e6c23a', text: '#e9e9e9', dim: '#8d8d8d',
  };

  // ---------- Canvas & scaling ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Grid (pre-rendered to an offscreen canvas) ----------
  const grid = new Uint8Array(COLS * ENC_ROWS);
  const field = document.createElement('canvas');
  field.width = W; field.height = ENC_ROWS * CELL;
  const fctx = field.getContext('2d');
  let bricksLeft = 0;

  function drawCell(c, r) {
    const v = grid[r * COLS + c];
    const x = c * CELL, y = r * CELL;
    fctx.fillStyle = COLORS.bg;
    fctx.fillRect(x, y, CELL, CELL);
    if (v === EMPTY) return;
    const [fill, edge] =
      v === WALL ? [COLORS.wall, COLORS.wallEdge] :
      v === SPECIAL ? [COLORS.special, COLORS.specialEdge] :
      [COLORS.brick, COLORS.brickEdge];
    fctx.fillStyle = edge;
    fctx.fillRect(x, y, CELL, CELL);
    fctx.fillStyle = fill;
    fctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  }

  // ---------- Levels ----------
  // LEVELS-START
  // Each level is a wall layout. The outer wall is always there; `gaps` are the
  // openings in the bottom wall (column ranges, inclusive) and `walls` adds
  // indestructible inner walls. Every other cell inside becomes a brick.
  // Interior columns are 1..46 and interior rows are 1..50.
  const LEVELS = [
    { name: 'Classic', gaps: [[21, 26]], walls() {} },
    { name: 'Twin Gates', gaps: [[6, 10], [37, 41]], walls() {} },
    { name: 'The Shelf', gaps: [[21, 26]], walls(w) {
        w.hline(36, 1, 46, [[3, 6], [41, 44]]);
    } },
    { name: 'Three Rooms', gaps: [[21, 26]], walls(w) {
        w.vline(16, 1, 50, [[8, 11]]);
        w.vline(31, 1, 50, [[30, 33]]);
    } },
    { name: 'Funnel', gaps: [[22, 25]], walls(w) {
        for (let c = 1; c <= 20; c++) {                 // solid stepped triangles
          for (let r = 30 + c; r <= 50; r++) { w.cell(c, r); w.cell(47 - c, r); }
        }
    } },
    { name: 'Cross', gaps: [[21, 26]], walls(w) {
        w.hline(25, 12, 35);
        w.vline(23, 14, 36); w.vline(24, 14, 36);
    } },
    { name: 'Zigzag', gaps: [[3, 7]], walls(w) {
        w.hline(36, 1, 46, [[40, 44]]);
        w.hline(24, 1, 46, [[3, 7]]);
        w.hline(12, 1, 46, [[40, 44]]);
    } },
    { name: 'Pillars', gaps: [[21, 26]], walls(w) {
        for (let i = 0; i < 4; i++) {
          const r = 8 + i * 10, shift = i % 2 ? 4 : 0;
          for (let c = 6 + shift; c <= 42; c += 8) w.box(c, r, c + 1, r + 1);
        }
    } },
    { name: 'Fortress', gaps: [[22, 25]], walls(w) {
        w.hline(10, 12, 35, [[22, 25]]);                 // the only way in is the top
        w.hline(30, 12, 35);
        w.vline(12, 10, 30); w.vline(35, 10, 30);
    } },
    { name: 'Needle', gaps: [[23, 24]], walls(w) {
        w.hline(42, 1, 46, [[23, 24]]);
        w.hline(20, 6, 41);
    } },
  ];
  // LEVELS-END

  const POCKET = 9;   // marker for cells kept empty above a gap

  // Returns the level's walls as a grid: WALL, EMPTY, or POCKET (everything EMPTY inside becomes a brick).
  function wallLayout(level) {
    const g = new Uint8Array(COLS * ENC_ROWS);
    const set = (c, r, v) => { if (c >= 0 && c < COLS && r >= 0 && r < ENC_ROWS) g[r * COLS + c] = v; };
    const inHoles = (n, holes) => holes.some(([a, b]) => n >= a && n <= b);
    const w = {
      cell: (c, r) => set(c, r, WALL),
      hline: (r, c0, c1, holes = []) => { for (let c = c0; c <= c1; c++) if (!inHoles(c, holes)) set(c, r, WALL); },
      vline: (c, r0, r1, holes = []) => { for (let r = r0; r <= r1; r++) if (!inHoles(r, holes)) set(c, r, WALL); },
      box: (c0, r0, c1, r1) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) set(c, r, WALL); },
    };
    // Outer wall with the level's gaps in the bottom edge.
    w.hline(0, 0, COLS - 1);
    w.hline(ENC_ROWS - 1, 0, COLS - 1, level.gaps);
    w.vline(0, 0, ENC_ROWS - 1);
    w.vline(COLS - 1, 0, ENC_ROWS - 1);
    level.walls(w);
    // Clear a small pocket just above each gap so the ball has room to enter.
    for (const [a, b] of level.gaps) for (let c = a; c <= b; c++) set(c, ENC_ROWS - 2, POCKET);
    return g;
  }

  function buildLevel(level) {
    grid.set(wallLayout(level));
    // Fill everything else inside with bricks.
    bricksLeft = 0;
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === POCKET) grid[i] = EMPTY;
      else if (grid[i] === EMPTY && Math.floor(i / COLS) < ENC_ROWS - 1) {
        grid[i] = Math.random() < SPECIAL_CHANCE ? SPECIAL : BRICK;
        bricksLeft++;
      }
    }
    fctx.fillStyle = COLORS.bg;
    fctx.fillRect(0, 0, field.width, field.height);
    for (let r = 0; r < ENC_ROWS; r++) for (let c = 0; c < COLS; c++) drawCell(c, r);
  }

  // Returns the cell value at a logical point; canvas edges and the top act as walls.
  function cellAt(px, py) {
    if (px < 0 || px >= W || py < 0) return WALL;
    const r = Math.floor(py / CELL);
    if (r >= ENC_ROWS) return EMPTY;
    return grid[r * COLS + Math.floor(px / CELL)];
  }

  // ---------- Entities ----------
  let balls = [], pickups = [], particles = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, prevX: W / 2 - PADDLE_W / 2, vel: 0, target: null };
  const MAX_LIVES = 5;
  let score = 0, lives = 3, state = 'ready', paused = false, best = 0;
  let levelIndex = 0, levelStartScore = 0, ballLostThisLevel = false;
  try { best = +localStorage.getItem('brickburst-best') || 0; } catch (e) {}
  try { levelIndex = Math.min(LEVELS.length - 1, Math.max(0, +localStorage.getItem('brickburst-level') || 0)); } catch (e) {}
  function saveLevel(v = levelIndex) { try { localStorage.setItem('brickburst-level', v); } catch (e) {} }

  function newBall(x, y, angleDeg) {
    if (balls.length >= MAX_BALLS) return;
    const a = angleDeg * Math.PI / 180;
    balls.push({ x, y, vx: ballSpeed * Math.sin(a), vy: -ballSpeed * Math.cos(a) });
  }

  let currentBall = null;   // the ball being moved right now (set during update)

  // Turns one ball into three at the same spot: the original keeps its path,
  // the two new ones fan out 25 degrees to either side.
  function splitBall(b) {
    for (const deg of [-25, 25]) {
      if (balls.length >= MAX_BALLS) return;
      const a = deg * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
      balls.push({ x: b.x, y: b.y, vx: b.vx * cos - b.vy * sin, vy: b.vx * sin + b.vy * cos });
    }
  }

  function startLevel(i) {
    levelIndex = i;
    saveLevel();
    buildLevel(LEVELS[i]);
    balls = []; pickups = []; particles = [];
    levelStartScore = score;
    ballLostThisLevel = false;
    state = 'ready';
    paddle.x = W / 2 - PADDLE_W / 2;
  }

  // A new game starts at the level you last reached.
  function resetGame() {
    score = 0; lives = 3;
    startLevel(levelIndex);
  }

  function launch() {
    if (state === 'ready') {
      newBall(paddle.x + PADDLE_W / 2, PADDLE_Y - BALL_R - 1, (Math.random() * 40 - 20));
      state = 'play';
    } else if (state === 'cleared') {
      startLevel(levelIndex + 1);
    } else if (state === 'over') {
      // Retry the same level with fresh lives and the score you had when it started.
      score = levelStartScore; lives = 3;
      startLevel(levelIndex);
    } else if (state === 'won') {
      levelIndex = 0;
      resetGame();
    }
  }

  function breakCell(c, r) {
    const i = r * COLS + c;
    const v = grid[i];
    if (v !== BRICK && v !== SPECIAL) return;
    grid[i] = EMPTY;
    drawCell(c, r);
    bricksLeft--;
    score += v === SPECIAL ? 5 : 1;
    const cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
    const color = v === SPECIAL ? COLORS.special : COLORS.brick;
    for (let k = 0; k < 4 && particles.length < 900; k++) {
      particles.push({
        x: cx, y: cy,
        vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160,
        life: 0.35 + Math.random() * 0.25, color,
      });
    }
    // The pickup remembers which ball broke the block, so that ball can split later.
    if (v === SPECIAL) pickups.push({ x: cx, y: cy, vy: 150, source: currentBall });
    blip(v === SPECIAL ? 880 : 520 + Math.random() * 120);
  }

  // True if the ball's bounding box at (x,y) overlaps anything solid.
  // Bricks it overlaps are burst.
  function collides(x, y) {
    let hit = x - BALL_R < 0 || x + BALL_R > W || y - BALL_R < 0;
    const c0 = Math.floor((x - BALL_R) / CELL), c1 = Math.floor((x + BALL_R - 1e-6) / CELL);
    const r0 = Math.floor((y - BALL_R) / CELL), r1 = Math.min(ENC_ROWS - 1, Math.floor((y + BALL_R - 1e-6) / CELL));
    for (let r = Math.max(0, r0); r <= r1; r++) {
      for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++) {
        const v = grid[r * COLS + c];
        if (v === EMPTY) continue;
        hit = true;
        if (v >= BRICK) breakCell(c, r);
      }
    }
    return hit;
  }

  function stepBall(b, dt) {
    // Move one axis at a time; only the axis whose move caused the overlap reverses.
    const nx = b.x + b.vx * dt;
    if (collides(nx, b.y)) b.vx = -b.vx; else b.x = nx;
    const ny = b.y + b.vy * dt;
    if (collides(b.x, ny)) b.vy = -b.vy; else b.y = ny;
    // Paddle
    if (b.vy > 0 &&
        b.y + BALL_R >= PADDLE_Y && b.y + BALL_R <= PADDLE_Y + PADDLE_H + 6 &&
        b.x >= paddle.x - BALL_R && b.x <= paddle.x + PADDLE_W + BALL_R) {
      // Mirror bounce (angle in = angle out). If the plank is moving, it drags
      // the ball along in that direction; a still plank is a pure mirror.
      const DEG = Math.PI / 180;
      const push = Math.max(-0.6, Math.min(0.6, paddle.vel * 0.35 / ballSpeed)) * ballSpeed;
      const a = Math.max(-60 * DEG, Math.min(60 * DEG, Math.atan2(b.vx + push, Math.abs(b.vy))));
      b.vx = ballSpeed * Math.sin(a);
      b.vy = -ballSpeed * Math.cos(a);
      b.y = PADDLE_Y - BALL_R;
      blip(300);
    }
  }

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    if (pickerOpen()) {
      if (e.key === 'Escape' || e.key === 'l' || e.key === 'L') closePicker();
      return;
    }
    if (e.key === 'l' || e.key === 'L') { openPicker(); return; }
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); launch(); }
    if (e.key === 'p' || e.key === 'P') paused = !paused;
    if (e.key === 'm' || e.key === 'M') muted = !muted;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      setSpeedLevel(speedLevel + (e.key === 'ArrowUp' ? 1 : -1));
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') paddle.target = null;
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // Changes the ball speed; balls already in flight keep their direction but
  // switch to the new speed immediately.
  let speedFlash = 0;
  function setSpeedLevel(level) {
    const next = Math.max(0, Math.min(SPEED_LEVELS.length - 1, level));
    speedFlash = 1.2;
    if (next === speedLevel) return;
    const ratio = SPEED_LEVELS[next] / ballSpeed;
    speedLevel = next;
    ballSpeed = SPEED_LEVELS[next];
    for (const b of balls) { b.vx *= ratio; b.vy *= ratio; }
    try { localStorage.setItem('brickburst-speed', speedLevel); } catch (e) {}
  }
  try {
    const saved = localStorage.getItem('brickburst-speed');
    if (saved !== null) setSpeedLevel(+saved);
    speedFlash = 0;
  } catch (e) {}

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
  }

  // On-screen buttons (for phones, where there are no arrow keys).
  const HUD_Y = H - 60;
  const BUTTONS = [
    { id: 'slower', label: '−', x: W / 2 - 104, y: HUD_Y + 13, w: 26, h: 22, act: () => setSpeedLevel(speedLevel - 1) },
    { id: 'faster', label: '+', x: W / 2 + 74,  y: HUD_Y + 13, w: 26, h: 22, act: () => setSpeedLevel(speedLevel + 1) },
    { id: 'pause',  label: () => paused ? '▶' : '❚❚', x: 14, y: HUD_Y + 36, w: 34, h: 20, act: () => { paused = !paused; } },
    { id: 'mute',   label: () => muted ? '🔇' : '🔊', x: W - 48, y: HUD_Y + 36, w: 34, h: 20, act: () => { muted = !muted; } },
    { id: 'levels', label: '☰ Levels', x: 56, y: HUD_Y + 36, w: 74, h: 20, act: () => openPicker() },
  ];
  function buttonAt(p) {
    return BUTTONS.find(b => p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6);
  }

  canvas.addEventListener('pointermove', e => {
    const p = pointerPos(e);
    if (!buttonAt(p)) paddle.target = p.x;   // drag anywhere (except on a button) to move
  });
  canvas.addEventListener('pointerdown', e => {
    initAudio();
    const p = pointerPos(e);
    const btn = buttonAt(p);
    if (btn) { btn.act(); return; }
    paddle.target = p.x;
    if (paused) { paused = false; return; }
    launch();
  });

  // ---------- Level picker ----------
  const picker = document.getElementById('levels');
  const pickerGrid = picker.querySelector('.grid');
  let cleared = new Set();
  try { cleared = new Set(JSON.parse(localStorage.getItem('brickburst-cleared') || '[]')); } catch (e) {}
  function markCleared(i) {
    cleared.add(i);
    try { localStorage.setItem('brickburst-cleared', JSON.stringify([...cleared])); } catch (e) {}
  }

  // Small preview of a level: walls grey, bricks red, gaps open.
  function drawPreview(cv, level) {
    cv.width = COLS; cv.height = ENC_ROWS;
    const g = wallLayout(level), x = cv.getContext('2d');
    x.fillStyle = COLORS.bg; x.fillRect(0, 0, COLS, ENC_ROWS);
    for (let r = 0; r < ENC_ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = g[r * COLS + c];
      if (v === WALL) x.fillStyle = COLORS.wall;
      else if (v === EMPTY && r < ENC_ROWS - 1) x.fillStyle = COLORS.brick;
      else continue;
      x.fillRect(c, r, 1, 1);
    }
  }

  const pickerOpen = () => picker.classList.contains('open');
  function openPicker() {
    if (state === 'play') paused = true;
    pickerGrid.innerHTML = '';
    LEVELS.forEach((level, i) => {
      const tile = document.createElement('button');
      tile.className = 'tile' + (i === levelIndex ? ' current' : '');
      tile.setAttribute('aria-label', 'Level ' + (i + 1) + ', ' + level.name + (cleared.has(i) ? ', cleared' : ''));
      const cv = document.createElement('canvas');
      drawPreview(cv, level);
      const name = document.createElement('div');
      name.className = 'name';
      name.innerHTML = '<span></span><span class="done"></span>';
      name.children[0].textContent = (i + 1) + ' · ' + level.name;
      name.children[1].textContent = cleared.has(i) ? '✓' : '';
      tile.append(cv, name);
      tile.addEventListener('click', () => {
        closePicker();
        paused = false;
        score = 0; lives = 3;
        startLevel(i);
      });
      pickerGrid.append(tile);
    });
    picker.classList.add('open');
    (pickerGrid.children[levelIndex] || pickerGrid.firstChild).focus();
  }
  function closePicker() { picker.classList.remove('open'); }
  picker.querySelector('.close').addEventListener('click', closePicker);
  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });

  // Pause automatically when the app is sent to the background.
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

  // ---------- Sound ----------
  let audio = null, muted = false, lastBlip = 0;
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  window.addEventListener('keydown', initAudio, { once: true });
  function blip(freq) {
    if (!audio || muted) return;
    const now = audio.currentTime;
    if (now - lastBlip < 0.03) return;
    lastBlip = now;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.04, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    o.connect(g).connect(audio.destination);
    o.start(now); o.stop(now + 0.07);
  }

  // ---------- Update ----------
  function update(dt) {
    // Paddle
    if (keys.ArrowLeft || keys.a) paddle.x -= PADDLE_SPEED * dt;
    if (keys.ArrowRight || keys.d) paddle.x += PADDLE_SPEED * dt;
    if (paddle.target !== null) paddle.x = paddle.target - PADDLE_W / 2;
    paddle.x = Math.max(0, Math.min(W - PADDLE_W, paddle.x));
    // Smoothed plank velocity (px/s), used to push the ball on contact.
    const rawVel = dt > 0 ? (paddle.x - paddle.prevX) / dt : 0;
    paddle.vel = paddle.vel * 0.6 + rawVel * 0.4;
    paddle.prevX = paddle.x;

    if (state !== 'play') return;

    // Balls (sub-stepped so they never skip a cell)
    const steps = Math.ceil(ballSpeed * dt / 2.5);
    const sdt = dt / steps;
    for (const b of balls) { currentBall = b; for (let s = 0; s < steps; s++) stepBall(b, sdt); }
    currentBall = null;
    balls = balls.filter(b => b.y - BALL_R < H);

    // Pickups: fall straight down; catching one splits its ball into 3
    for (const p of pickups) {
      p.y += p.vy * dt;
      if (p.y + 8 >= PADDLE_Y && p.y - 8 <= PADDLE_Y + PADDLE_H &&
          p.x + 14 >= paddle.x && p.x - 14 <= paddle.x + PADDLE_W) {
        p.caught = true;
        // The ball that broke the yellow block becomes 3 balls right where it is.
        // If that ball is already gone, the newest ball in play splits instead.
        const src = balls.includes(p.source) ? p.source : balls[balls.length - 1];
        if (src) splitBall(src);
        else for (const d of [-22, 0, 22]) newBall(paddle.x + PADDLE_W / 2, PADDLE_Y - BALL_R - 1, d);
        blip(1100);
      }
    }
    pickups = pickups.filter(p => !p.caught && p.y < H + 20);

    // Particles
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    if (score > best) { best = score; try { localStorage.setItem('brickburst-best', best); } catch (e) {} }

    if (bricksLeft <= 0) {
      balls = []; pickups = [];
      markCleared(levelIndex);
      if (levelIndex + 1 < LEVELS.length) {
        state = 'cleared';
        lives = Math.min(MAX_LIVES, lives + 1);       // bonus life for clearing a level
        saveLevel(levelIndex + 1);                    // reopening the app continues at the next level
      } else {
        state = 'won';
        saveLevel(0);
      }
      return;
    }
    if (balls.length === 0) {
      lives--;
      ballLostThisLevel = true;
      pickups = [];
      state = lives > 0 ? 'ready' : 'over';
    }
  }

  // ---------- Render ----------
  function render() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(field, 0, 0);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    // Pickups
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of pickups) {
      ctx.fillStyle = COLORS.pickup;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(p.x - 14, p.y - 8, 28, 16, 4) : ctx.rect(p.x - 14, p.y - 8, 28, 16);
      ctx.fill();
      ctx.fillStyle = '#2a2000';
      ctx.fillText('+3', p.x, p.y + 0.5);
    }

    // Paddle
    ctx.fillStyle = COLORS.paddle;
    ctx.fillRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H);

    // Balls
    ctx.fillStyle = COLORS.ball;
    if (state === 'ready') {
      ctx.beginPath();
      ctx.arc(paddle.x + PADDLE_W / 2, PADDLE_Y - BALL_R - 1, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    for (const b of balls) { ctx.moveTo(b.x + BALL_R, b.y); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); }
    ctx.fill();

    // HUD
    const hudY = H - 60;
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = COLORS.text;
    ctx.textAlign = 'left';  ctx.fillText('Score ' + score, 16, hudY);
    ctx.textAlign = 'center'; ctx.fillText('Level ' + (levelIndex + 1) + '   Balls ' + balls.length, W / 2, hudY);
    ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 16, hudY);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = COLORS.dim;
    ctx.textAlign = 'left';  ctx.fillText('Best ' + best, 16, hudY + 24);
    ctx.textAlign = 'right'; ctx.fillText('Bricks ' + bricksLeft, W - 16, hudY + 24);
    // Speed meter: 10 bars, filled up to the current level
    ctx.textAlign = 'center';
    ctx.fillStyle = speedFlash > 0 ? COLORS.text : COLORS.dim;
    ctx.fillText('Speed ' + (speedLevel + 1), W / 2 - 40, hudY + 24);
    for (let i = 0; i < SPEED_LEVELS.length; i++) {
      ctx.fillStyle = i <= speedLevel ? COLORS.paddle : '#3a3a3a';
      const bh = 4 + i * 1.2;                         // bars grow taller, bottom-aligned
      ctx.fillRect(W / 2 - 4 + i * 7, hudY + 30 - bh, 5, bh);
    }
    ctx.fillStyle = COLORS.dim;
    ctx.fillText('←/→ move · ↑/↓ speed · L levels', W / 2 + 40, hudY + 46);
    // On-screen buttons
    ctx.font = 'bold 14px system-ui, sans-serif';
    for (const b of BUTTONS) {
      ctx.fillStyle = '#2c2c2c';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(b.x, b.y, b.w, b.h, 5) : ctx.rect(b.x, b.y, b.w, b.h);
      ctx.fill();
      ctx.fillStyle = COLORS.text;
      ctx.fillText(typeof b.label === 'function' ? b.label() : b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    // Messages
    let msg = null, sub = null;
    if (paused) { msg = 'Paused'; sub = 'Tap or press P to resume'; }
    else if (state === 'ready') {
      msg = !ballLostThisLevel ? 'Level ' + (levelIndex + 1) + ' · ' + LEVELS[levelIndex].name : 'Ball lost';
      sub = 'Tap or press Space to launch · ☰ Levels to pick another';
    }
    else if (state === 'over') { msg = 'Game over'; sub = 'Tap or press Space to retry level ' + (levelIndex + 1); }
    else if (state === 'cleared') { msg = 'Level ' + (levelIndex + 1) + ' cleared!'; sub = '+1 life · tap or Space for level ' + (levelIndex + 2); }
    else if (state === 'won') { msg = 'All ' + LEVELS.length + ' levels cleared!'; sub = 'Score ' + score + ' · tap or Space to play again'; }
    if (msg) {
      const y = (ENC_ROWS * CELL + PADDLE_Y) / 2;
      ctx.textAlign = 'center';
      ctx.fillStyle = COLORS.text;
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.fillText(msg, W / 2, y - 12);
      ctx.fillStyle = COLORS.dim;
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(sub, W / 2, y + 16);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    speedFlash = Math.max(0, speedFlash - dt);
    render();
    requestAnimationFrame(frame);
  }

  resetGame();
  requestAnimationFrame(frame);

  // Offline / installable support (only works when served over http(s), not file://).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
